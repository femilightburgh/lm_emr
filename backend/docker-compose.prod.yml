services:
  postgres:
    image: postgres:17
    container_name: lm_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lm_password}
      POSTGRES_DB: ${POSTGRES_DB:-lm_emr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lm_emr_api
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lm_admin}:${POSTGRES_PASSWORD:-lm_password}@postgres:5432/${POSTGRES_DB:-lm_emr}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.example.com}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
