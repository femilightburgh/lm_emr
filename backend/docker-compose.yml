services:
  postgres:
    image: postgres:17
    container_name: lm_postgres

    environment:
      POSTGRES_USER: lm_admin
      POSTGRES_PASSWORD: lm_password
      POSTGRES_DB: lm_emr

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: